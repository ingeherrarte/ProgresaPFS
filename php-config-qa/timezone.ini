; Sin esto, PHP corre en UTC (el reloj del contenedor), aunque MySQL ya esté
; en hora de Guatemala. Afecta sobre todo el autollenado de "hoy" en
; Día/Mes del pago al crear un recibo nuevo (RecibosPfsView::mostrarFormulario
; usa date('j')/date('n')): entre 6PM y medianoche hora Guatemala, el
; contenedor en UTC ya está en el día siguiente, así que precargaba el
; día/mes de mañana en vez de hoy.
date.timezone = America/Guatemala
