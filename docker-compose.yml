services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mi_base
      TZ: America/Guatemala
    # Offset fijo (Guatemala no tiene horario de verano) en vez de nombre de
    # zona, para no depender de que las tablas de zonas horarias de MySQL
    # estén cargadas (mysql_tzinfo_to_sql). Sin esto, NOW()/CURRENT_TIMESTAMP
    # quedaban en UTC y todo lo registrado entre 6PM-medianoche hora local
    # caía bajo la fecha del día siguiente (afectaba cierre de caja).
    command: --default-time-zone=-06:00
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

  php:
    build:
      context: ./php-config
    container_name: php
    restart: always
    volumes:
      - ./www:/var/www/html
      - ./php-config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      # Respaldos generados por BackupModel (fuera de ./www a propósito: esa
      # carpeta es servida directo por Apache, y un backup ahí sería
      # descargable por cualquiera con el link, sin pasar por sesión).
      - ./backups:/var/backups/cetecpro
      # Config de rclone con el token OAuth de Dropbox ya autorizado (ver
      # BackupModel::subirANube). Solo lectura: el contenedor nunca necesita
      # reescribirla.
      - ./rclone/rclone.conf:/etc/rclone/rclone.conf:ro
    ports:
      - "80:80"
    depends_on:
      - mysql

  php_qa:
    build:
      context: ./php-config-qa
    container_name: php_qa
    restart: always
    volumes:
      - /srv/mi-stack-qa/www:/var/www/html
      - ./php-config-qa/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./backups-qa:/var/backups/cetecpro
      - ./rclone/rclone.conf:/etc/rclone/rclone.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - mysql

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"

volumes:
  mysql_data:
  portainer_data:
